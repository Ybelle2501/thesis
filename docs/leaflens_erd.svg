<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
<title id="title">Entity relationship diagram</title><desc id="desc">Physical ERD showing all implemented SQLite fields, metadata keys, and the external image reference. No foreign keys exist.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17634c"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .flowlabel{paint-order:stroke;stroke:white;stroke-width:8px;stroke-linejoin:round}</style>
<rect width="1800" height="1320" fill="white"/>
<text x="65" y="57" font-size="16" fill="#17634c" text-anchor="start" font-weight="700">LEAFLENS / SYSTEM DOCUMENTATION</text>
<text x="65" y="108" font-size="36" fill="#18392f" text-anchor="start" font-weight="700">Entity relationship diagram</text>
<text x="65" y="145" font-size="19" fill="#52685e" text-anchor="start" font-weight="400">Physical schema / scan_history.db / schema version 2 / two independent tables</text>
<polyline points="65,170 1735,170" fill="none" stroke="#8ea99c" stroke-width="2.4" stroke-linejoin="round"/>
<text x="1735" y="1292" font-size="15" fill="#52685e" text-anchor="end" font-weight="400">Implementation snapshot / 2026-11-12</text>
<rect x="65" y="225" width="1040" height="745" rx="6" fill="white" stroke="#8ea99c" stroke-width="2"/>
<rect x="65" y="225" width="1040" height="55" rx="0" fill="#17634c" stroke="#17634c" stroke-width="2"/>
<text x="89" y="262" font-size="25" fill="white" text-anchor="start" font-weight="700">scan_history</text>
<text x="87" y="313" font-size="16" fill="#52685e" text-anchor="start" font-weight="700">KEY</text>
<text x="157" y="313" font-size="16" fill="#52685e" text-anchor="start" font-weight="700">COLUMN</text>
<text x="415" y="313" font-size="16" fill="#52685e" text-anchor="start" font-weight="700">SQL TYPE / CONSTRAINT</text>
<polyline points="65,333 1105,333" fill="none" stroke="#8ea99c" stroke-width="2.4" stroke-linejoin="round"/>
<rect x="66" y="334" width="1038" height="48" fill="#f5f8f6"/>
<text x="87" y="365" font-size="17" fill="#17634c" text-anchor="start" font-weight="700">PK</text>
<text x="157" y="365" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">id</text>
<text x="415" y="365" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">INTEGER PRIMARY KEY AUTOINCREMENT</text>
<text x="87" y="414" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="414" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">plant</text>
<text x="415" y="414" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL</text>
<rect x="66" y="432" width="1038" height="48" fill="#f5f8f6"/>
<text x="87" y="463" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="463" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">disease</text>
<text x="415" y="463" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL</text>
<text x="87" y="512" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="512" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">status</text>
<text x="415" y="512" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL CHECK: Healthy | Infected</text>
<rect x="66" y="530" width="1038" height="48" fill="#f5f8f6"/>
<text x="87" y="561" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="561" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">confidence</text>
<text x="415" y="561" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">REAL NOT NULL</text>
<text x="87" y="610" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="610" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">image_path</text>
<text x="415" y="610" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL</text>
<rect x="66" y="628" width="1038" height="48" fill="#f5f8f6"/>
<text x="87" y="659" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="659" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">raw_label</text>
<text x="415" y="659" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL</text>
<text x="87" y="708" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="708" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">class_index</text>
<text x="415" y="708" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">INTEGER NOT NULL</text>
<rect x="66" y="726" width="1038" height="48" fill="#f5f8f6"/>
<text x="87" y="757" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="757" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">captured_at</text>
<text x="415" y="757" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">INTEGER NOT NULL / UTC epoch ms</text>
<text x="87" y="806" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="806" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">source</text>
<text x="415" y="806" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL</text>
<rect x="66" y="824" width="1038" height="48" fill="#f5f8f6"/>
<text x="87" y="855" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="855" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">scan_mode</text>
<text x="415" y="855" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL</text>
<text x="87" y="904" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="904" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">grid_cell</text>
<text x="415" y="904" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">INTEGER (nullable)</text>
<rect x="66" y="922" width="1038" height="48" fill="#f5f8f6"/>
<text x="87" y="953" font-size="17" fill="#17634c" text-anchor="start" font-weight="700"></text>
<text x="157" y="953" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">location</text>
<text x="415" y="953" font-size="19" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">TEXT NOT NULL DEFAULT &#x27;&#x27;</text>
<rect x="1190" y="225" width="545" height="185" rx="0" fill="#edf3fa" stroke="#8ea99c" stroke-width="2"/>
<polyline points="1207,225 1207,410" fill="none" stroke="#8ea99c" stroke-width="2.4" stroke-linejoin="round"/>
<text x="1462.5" y="257" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">app_metadata</text>
<text x="1215" y="305" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">PK   key      TEXT PRIMARY KEY</text>
<text x="1215" y="357" font-size="21" fill="#18392f" text-anchor="start" font-weight="400" style="font-family:Consolas,monospace">     value    TEXT NOT NULL</text>
<rect x="1190" y="450" width="545" height="253" rx="8" fill="#fff7e6" stroke="#d3bb84" stroke-width="2"/>
<text x="1212" y="482" font-size="20" fill="#18392f" text-anchor="start" font-weight="700">Implemented metadata keys</text>
<text x="1212" y="514" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">language  -&gt;  en | tl</text>
<text x="1212" y="540" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">next_report_number  -&gt;  integer as text</text>
<text x="1212" y="566" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">farm_location_options_v1</text>
<text x="1212" y="592" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">  -&gt; JSON array, e.g. [&quot;Greenhouse 1&quot;]</text>
<text x="1212" y="618" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Independent settings; no relationship to scan IDs.</text>
<rect x="1190" y="800" width="545" height="165" rx="0" fill="white" stroke="#8ea99c" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1215" y="838" font-size="23" fill="#18392f" text-anchor="start" font-weight="700">Scan image files / outside SQLite</text>
<text x="1215" y="875" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">scan_history_images/</text>
<text x="1215" y="901" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">One copied image per saved scan or grid cell.</text>
<text x="1215" y="927" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Path reference only; no database foreign key.</text>
<polyline points="1105,602.5 1147,602.5 1147,878 1190,878" fill="none" stroke="#17634c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<text x="1150" y="764" font-size="16" fill="#52685e" text-anchor="start" font-weight="400" class="flowlabel">file</text>
<rect x="65" y="1020" width="1670" height="225" rx="8" fill="#fff7e6" stroke="#d3bb84" stroke-width="2"/>
<text x="87" y="1052" font-size="20" fill="#18392f" text-anchor="start" font-weight="700">Persistence and relationship rules</text>
<text x="87" y="1084" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">No foreign keys, join tables, user accounts, crop tables, report tables, or forecast tables are implemented.</text>
<text x="87" y="1110" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">location stores a text snapshot; editing the saved choice list does not rename existing scan tags.</text>
<text x="87" y="1136" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Single scans have grid_cell = NULL; a saved 2 x 3 grid produces up to six independent scan rows (cells 1-6).</text>
<text x="87" y="1162" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Only successful classifications are saved after the user supplies a location and chooses Save. Other results remain temporary.</text>
<text x="87" y="1188" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Indexes: scan_history_captured_at (captured_at DESC) and scan_history_status (status).</text>
</svg>