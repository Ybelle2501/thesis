<text x="478" y="670" font-size="16" fill="#18392f" text-anchor="end" font-weight="400" class="flowlabel">D2 stage assets</text>
<text x="478" y="694" font-size="16" fill="#18392f" text-anchor="end" font-weight="400" class="flowlabel">Models / labels / thresholds</text>
<rect x="65" y="1730" width="1670" height="115" rx="8" fill="#fff7e6" stroke="#d3bb84" stroke-width="2"/>
<text x="87" y="1762" font-size="20" fill="#18392f" text-anchor="start" font-weight="700">Persistence boundary</text>
<text x="87" y="1794" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Rejected, low-confidence and failed results remain temporary. Stage gates and alternatives are not written as separate database records.</text>
<text x="87" y="1820" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Grid saving can partially succeed; retry skips cells already saved. Saved history has no parent grid-session table or capture-group ID.</text>
