<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1920" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc">
<title id="title">Data flow / three-stage scanning</title><desc id="desc">Detailed scan DFD showing image input, optional six-cell split, plant and crop gates, disease inference, temporary results, and explicit persistence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#17634c"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .flowlabel{paint-order:stroke;stroke:white;stroke-width:8px;stroke-linejoin:round}</style>
<rect width="1800" height="1920" fill="white"/>
<text x="65" y="57" font-size="16" fill="#17634c" text-anchor="start" font-weight="700">LEAFLENS / SYSTEM DOCUMENTATION</text>
<text x="65" y="108" font-size="36" fill="#18392f" text-anchor="start" font-weight="700">Data flow / three-stage scanning</text>
<text x="65" y="145" font-size="19" fill="#52685e" text-anchor="start" font-weight="400">Level 2 / decomposition of process 1.0 / identical pipeline for a single image and each grid cell</text>
<polyline points="65,170 1735,170" fill="none" stroke="#8ea99c" stroke-width="2.4" stroke-linejoin="round"/>
<text x="1735" y="1892" font-size="15" fill="#52685e" text-anchor="end" font-weight="400">Implementation snapshot / 2026-11-12</text>
