<text x="1487.5" y="1492" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">scan_history; copied image files</text>
<text x="1487.5" y="1519" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">app_metadata location-choice list</text>
<rect x="1240" y="245" width="495" height="145" rx="0" fill="#edf3fa" stroke="#8ea99c" stroke-width="2"/>
<polyline points="1257,245 1257,390" fill="none" stroke="#8ea99c" stroke-width="2.4" stroke-linejoin="round"/>
<text x="1487.5" y="277" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">D2  Inference assets</text>
<text x="1487.5" y="307" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Stage 1 and Stage 2 TFLite gates</text>
<text x="1487.5" y="334" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Stage 3 MobileNetV2</text>
<text x="1487.5" y="361" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Labels and decision thresholds</text>
<rect x="65" y="1430" width="290" height="110" rx="0" fill="white" stroke="#8ea99c" stroke-width="2"/>
<text x="210.0" y="1462" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">E1  App user</text>
<text x="210.0" y="1492" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Same user / farm scout</text>
<polyline points="355,285 570,285" fill="none" stroke="#17634c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
