<text x="210.0" y="277" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">E1  App user</text>
<text x="210.0" y="307" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Mode / capture request</text>
<rect x="65" y="440" width="290" height="110" rx="0" fill="white" stroke="#8ea99c" stroke-width="2"/>
<text x="210.0" y="472" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">E2  Camera / gallery</text>
<text x="210.0" y="502" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Capture / select image</text>
<rect x="570" y="235" width="550" height="145" rx="18" fill="#edf5ef" stroke="#17634c" stroke-width="2"/>
<text x="845.0" y="267" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">1.1  Prepare scan input</text>
<text x="845.0" y="297" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Decode and correct orientation</text>
<text x="845.0" y="324" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Single image OR six 2 x 3 JPEG tiles</text>
<rect x="570" y="490" width="550" height="130" rx="18" fill="#edf5ef" stroke="#17634c" stroke-width="2"/>
<text x="845.0" y="522" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">1.2  Plant gate / Stage 1</text>
<text x="845.0" y="552" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Require confident plant classification</text>
<rect x="570" y="745" width="550" height="140" rx="18" fill="#edf5ef" stroke="#17634c" stroke-width="2"/>
<text x="845.0" y="777" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">1.3  Crop gate / Stage 2</text>
<text x="845.0" y="807" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Require confident supported crop</text>
<text x="845.0" y="834" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Banana / lettuce / pineapple / tomato</text>
<rect x="570" y="1020" width="550" height="150" rx="18" fill="#edf5ef" stroke="#17634c" stroke-width="2"/>
<text x="845.0" y="1052" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">1.4  Disease model / Stage 3</text>
<text x="845.0" y="1082" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">MobileNetV2 / 18 condition labels</text>
<text x="845.0" y="1109" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Confidence + margin; crop agreement</text>
<rect x="1240" y="1010" width="495" height="160" rx="18" fill="#edf5ef" stroke="#17634c" stroke-width="2"/>
<text x="1487.5" y="1042" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">1.5  Present scan results</text>
<text x="1487.5" y="1072" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Label; confidence; alternatives</text>
<text x="1487.5" y="1099" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Rejected / uncertain / error messages</text>
<text x="1487.5" y="1126" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Grid summary excludes ignored cells</text>
<rect x="570" y="1430" width="550" height="160" rx="18" fill="#edf5ef" stroke="#17634c" stroke-width="2"/>
<text x="845.0" y="1462" font-size="21" fill="#18392f" text-anchor="middle" font-weight="700">1.6  Save successful result</text>
<text x="845.0" y="1492" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Require location + explicit Save request</text>
<text x="845.0" y="1519" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">Copy image and insert scan row</text>
<text x="845.0" y="1546" font-size="18" fill="#52685e" text-anchor="middle" font-weight="400">One row per accepted, saved grid cell</text>
