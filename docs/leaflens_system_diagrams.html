<text x="1212" y="592" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">  -&gt; JSON array, e.g. [&quot;Greenhouse 1&quot;]</text>

<text x="1215" y="875" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">scan_history_images/</text>
<text x="1215" y="901" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">One copied image per saved scan or grid cell.</text>
<text x="1215" y="927" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Path reference only; no database foreign key.</text>
<polyline points="1105,602.5 1147,602.5 1147,878 1190,878" fill="none" stroke="#17634c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/>

<text x="87" y="1084" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">No foreign keys, join tables, user accounts, crop tables, report tables, or forecast tables are implemented.</text>
<text x="87" y="1110" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">location stores a text snapshot; editing the saved choice list does not rename existing scan tags.</text>
<text x="87" y="1136" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Single scans have grid_cell = NULL; a saved 2 x 3 grid produces up to six independent scan rows (cells 1-6).</text>
<text x="87" y="1162" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Only successful classifications are saved after the user supplies a location and chooses Save. Other results remain temporary.</text>
<text x="87" y="1188" font-size="18" fill="#52685e" text-anchor="start" font-weight="400">Indexes: scan_history_captured_at (captured_at DESC) and scan_history_status (status).</text>
